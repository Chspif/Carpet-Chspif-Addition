final int mcVersion = project.mcVersion as int

final boolean unobfuscated = mcVersion >= 260000

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'

repositories {
	maven { url = 'https://masa.dy.fi/maven' }
	flatDir { dirs rootProject.file('libs') }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (!unobfuscated) {
		mappings loom.officialMojangMappings()
	}
	if (unobfuscated) {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "carpet:fabric-carpet:${project.carpet_core_version}"
	} else {
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "carpet:fabric-carpet:${project.carpet_core_version}"
	}
}

final int javaTarget = mcVersion >= 260000 ? 25 : (mcVersion >= 12005 ? 21 : 17)
final JavaVersion JAVA_VERSION = javaTarget == 25 ? JavaVersion.VERSION_25
		: (javaTarget == 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)

group = project.maven_group

base.archivesName = project.archives_base_name
version = "v${project.mod_version}-mc${project.minecraft_version}"

processResources {
	inputs.property "version", project.mod_version
	inputs.property "carpet_dependency", project.carpet_dependency
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "java_dependency", project.java_dependency

	filesMatching("fabric.mod.json") {
		def valueMap = [
			"id": project.mod_id,
			"name": project.mod_name,
			"version": project.mod_version,
			"carpet_dependency": project.carpet_dependency,
			"minecraft_dependency": project.minecraft_dependency,
			"java_dependency": project.java_dependency,
		]
		expand valueMap
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = javaTarget
}

java {
	sourceCompatibility = JAVA_VERSION
	targetCompatibility = JAVA_VERSION
}

final String extraJarNames = (project.findProperty('extra_jar_names') ?: '').toString().trim()

if (!extraJarNames.isEmpty()) {
	def extraJarsTask = tasks.register('extraJars') {
		doLast {
			def libsDir = project.layout.buildDirectory.dir('libs').get().asFile
			def sourceJar = new File(libsDir, "${project.archives_base_name}-v${project.mod_version}-mc${project.minecraft_version}.jar")
			if (!sourceJar.exists()) {
				throw new GradleException("extraJars: main jar not found: ${sourceJar}")
			}
			extraJarNames.split(',').collect { it.trim() }.findAll { !it.isEmpty() }.each { name ->
				project.copy {
					from sourceJar
					into libsDir
					rename { "${project.archives_base_name}-v${project.mod_version}-mc${name}.jar" }
				}
			}
		}
	}
	tasks.named('build').configure { finalizedBy extraJarsTask }
}
