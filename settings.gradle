import groovy.json.JsonSlurper

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Jitpack'
			url = 'https://jitpack.io'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			switch (requested.id.id) {
				case 'com.replaymod.preprocess':
					useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
					break
			}
		}
	}
}

rootProject.name = 'carpet-chspif-addition'

def versions = new JsonSlurper().parseText(file('minecraftVersions.json').text)
versions.versions.each { version ->
	include(":$version")
	def proj = project(":$version")
	proj.projectDir = file("versions/$version")
	proj.buildFileName = '../../common.gradle'
}
